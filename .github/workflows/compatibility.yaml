name: Postgres rustls compatibility
on:
  push:
    branches: [gitar-0.6.11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-tls:
    runs-on: namespace-profile-gitar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/rustls -> target
      - run: cargo check --locked --no-default-features --features postgresql,pooled,json,uuid,chrono,bigdecimal
      - run: cargo clippy --locked --manifest-path tests/rustls/Cargo.toml --all-targets
      - run: python3 tests/rustls/run.py
      - name: Verify Postgres dependency tree has no native TLS or OpenSSL
        run: |
          cargo tree --locked --manifest-path tests/rustls/Cargo.toml -e normal,build --prefix none > /tmp/postgres-dependencies.txt
          if grep -E '^(native-tls|openssl|openssl-sys|postgres-native-tls) v' /tmp/postgres-dependencies.txt; then
            exit 1
          fi
