[package]
authors = [
  "Julius de Bruijn <bruijn@prisma.io>",
  "Katharina Fey <kookie@spacekookie.de>",
  "Tom Houlé <tom@tomhoule.com>",
  "Emanuel Jöbstl <emanuel.joebstl@gmail.com>",
  "Matthias Oertel <oertel@prisma.io>",
  "Dominic Petrick <petrick@prisma.io>",
]
description = "An abstraction layer for SQL databases."
documentation = "https://docs.rs/quaint/"
edition = "2018"
homepage = "https://github.com/prisma/quaint/"
keywords = ["mysql", "postgresql", "sqlite", "sql"]
license = "Apache-2.0"
name = "quaint"
readme = "README.md"
repository = "https://github.com/gitarcode/quaint"
version = "0.2.0-alpha.13"
resolver = "2"

[package.metadata.docs.rs]
features = ["docs", "all"]

[features]
default = []
docs = []
# Expose the underlying database drivers when a connector is enabled. This is a
# way to access database-specific methods when you need extra control.
expose-drivers = []

all = [
  "chrono",
  "json",
  "mssql",
  "mysql",
  "pooled",
  "postgresql",
  "serde-support",
  "sqlite",
  "uuid",
  "bigdecimal"
]

vendored-openssl = [
  "mysql_async/vendored-openssl"
]

postgresql = [
  "rustls",
  "rustls-native-certs",
  "rustls-pemfile",
  "tokio-postgres-rustls",
  "p12-keystore",
  "tokio-postgres",
  "postgres-types",
  "bytes",
  "tokio",
  "bit-vec",
  "lru-cache",
  "byteorder",
]

json = ["serde_json", "base64"]
mssql = ["tiberius", "uuid", "chrono", "tokio-util", "tokio/time", "tokio/net", "either"]
mysql = ["mysql_async", "tokio/time", "lru-cache"]
pooled = ["mobc"]
serde-support = ["serde", "chrono/serde"]
sqlite = ["rusqlite", "libsqlite3-sys", "tokio/sync"]
bigdecimal = ["bigdecimal_"]
fmt-sql = ["sqlformat"]

[dependencies]
connection-string = "0.1.10"
percent-encoding = "2"
tracing-core = "0.1"
async-trait = "0.1"
thiserror = "1.0"
num_cpus = "1.12"
metrics = "0.18"
tracing = "0.1"
futures = "0.3"
url = "2.1"
hex = "0.4"

either = { version = "1.6", optional = true }
base64 = { version = "0.12.3", optional = true }
chrono = { version = "0.4", optional = true, default-features = false }
lru-cache = { version = "0.1", optional = true }
serde_json = { version = "1.0.48", optional = true, features = ["float_roundtrip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pemfile = { version = "2", optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, optional = true }
p12-keystore = { version = "0.3.2", optional = true }
bit-vec = { version = "0.6.1", optional = true }
bytes = { version = "1.0", optional = true }
mobc = { git = "https://github.com/prisma/mobc",  tag = "1.0.6", optional = true }
serde = { version = "1.0", optional = true }
sqlformat = { version = "0.2.0", optional = true }

[dev-dependencies]
once_cell = "1.3"
indoc = "0.3"
names = "0.11"
paste = "1.0"
serde = { version = "1.0", features = ["derive"] }
test-macros = { path = "test-macros" }
test-setup = { path = "test-setup" }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }

[dependencies.byteorder]
default-features = false
optional = true
version = ">1.4.0"

[dependencies.mysql_async]
git = "https://github.com/prisma/mysql_async"
optional = true
rev = "e3f8bdb41d57e769412f53d0f479bf67fdcc0ee3"

[dependencies.rusqlite]
version = "0.25"
features = ["chrono", "bundled", "column_decltype"]
optional = true

[dependencies.libsqlite3-sys]
version = "0.22"
default-features = false
features = ["bundled"]
optional = true

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies.tiberius]
version = "0.11.2"
optional = true
features = ["sql-browser-tokio", "chrono", "bigdecimal"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.tiberius]
version = "0.11.2"
optional = true
default-features = false
features = ["sql-browser-tokio", "vendored-openssl", "chrono", "bigdecimal", "tds73", "winauth"]

[dependencies.bigdecimal_]
version = "0.3"
optional = true
package = "bigdecimal"

[dependencies.uuid]
version = "1"
optional = true

[dependencies.tokio-postgres]
features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1", "with-bit-vec-0_6"]
git = "https://github.com/pimeys/rust-postgres"
rev = "064a6a50427542e2c166e870027735aab3b52e77"
# branch = "pgbouncer-mode"
optional = true

[dependencies.postgres-types]
features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1", "with-bit-vec-0_6"]
git = "https://github.com/pimeys/rust-postgres"
rev = "064a6a50427542e2c166e870027735aab3b52e77"
# branch = "pgbouncer-mode"
optional = true

[dependencies.tokio]
version = "1.0"
features = ["rt-multi-thread", "macros", "sync"]
optional = true

[dependencies.tokio-util]
version = "0.6"
features = ["compat"]
optional = true

# The adapter and Quaint must use the same PgBouncer-patched driver source.
# Consumers repeat these patches at their workspace root.
[patch."https://github.com/pimeys/rust-postgres"]
tokio-postgres = { git = "https://github.com/gitarcode/rust-postgres", rev = "418e011eb5ea53fa2ca8050726df3fb6e224e60d" }
postgres-types = { git = "https://github.com/gitarcode/rust-postgres", rev = "418e011eb5ea53fa2ca8050726df3fb6e224e60d" }
postgres-protocol = { git = "https://github.com/gitarcode/rust-postgres", rev = "418e011eb5ea53fa2ca8050726df3fb6e224e60d" }

[patch.crates-io]
tokio-postgres = { git = "https://github.com/gitarcode/rust-postgres", rev = "418e011eb5ea53fa2ca8050726df3fb6e224e60d" }
